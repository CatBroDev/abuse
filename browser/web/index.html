<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Abuse browser runtime</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#080c14;color:#eafcff;width:100%;height:100%;overflow:hidden}
    body{display:grid;place-items:center;font:16px system-ui}
    canvas{display:block;width:min(100vw,133.333vh);height:auto;aspect-ratio:4/3;image-rendering:pixelated;touch-action:none;outline:none}
    #status{position:absolute;inset:0;display:grid;place-items:center;background:#080c14;padding:16px;text-align:center;pointer-events:none}
    #status:empty{display:none}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Abuse"></canvas><div id="status" role="status">Loading…</div>
  <script>
    var zh=new URLSearchParams(location.search).get('lang')==='zh-cn';
    document.documentElement.lang=zh?'zh-CN':'en';
    var statusElement=document.querySelector('#status');
    statusElement.textContent=zh?'正在加载游戏…':'Loading game…';
    var Module={
      canvas:document.querySelector('#canvas'),arguments:['-window','-datadir','/data'],
      print:console.log,printErr:console.error,
      onAbort:()=>{statusElement.textContent=zh?'游戏启动失败，请重新加载。':'Game failed to start. Reload to try again.';}
    };
  </script>
  <script src="persistence.js"></script><script src="input.js"></script><script src="bridge.js"></script>
  <script>
    var controlsReady=Module.onControlsReady,gameReady=Module.onGameReady,gameExit=Module.onExit;
    Module.onControlsReady=()=>{statusElement.textContent='';Module.controlsReady=true;controlsReady?.();};
    Module.onGameReady=()=>{Module.gameInitialized=true;gameReady?.();};
    Module.onExit=()=>{gameExit?.();statusElement.textContent=zh?'游戏已结束，请重新加载。':'Game stopped. Reload to play again.';};
  </script>
  <script src="assets.js"></script><script src="abuse.js"></script>
</body>
</html>
